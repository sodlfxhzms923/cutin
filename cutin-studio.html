<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컷인 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 웹폰트를 못 받는 환경에서도 제목이 가늘어지지 않도록, 시스템 굵은 글꼴을 400 굵기로 묶어 둡니다 */
@font-face{font-family:"Display Fallback";font-weight:400;src:local("Malgun Gothic Bold"),local("MalgunGothicBold"),local("Apple SD Gothic Neo Bold"),local("AppleSDGothicNeo-Bold"),local("Noto Sans CJK KR Black"),local("Noto Sans KR Black"),local("Noto Sans CJK KR Bold"),local("NanumGothic ExtraBold")}
:root{
  /* 원고지 한 장: 잉크 선, 논포토 블루 연필 가이드, 그리고 PPL 자리에만 긋는 형광 노랑 */
  --ink:#15161C; --ink-2:#3C3F4C; --ink-3:#6B7080;
  --line:#D3D8E0; --line-2:#E8EBF0;
  --paper:#FFFFFF; --desk:#EEF1F5;
  --blue:#2E93C6; --blue-soft:#B5DDF0; --blue-tint:#E9F5FB;
  --ppl:#FFD91A; --ppl-soft:#FFF4B0;
  --ok:#12805C; --warn:#B8500C; --bad:#C2203F;
  --f-display:"Black Han Sans","Display Fallback","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-bubble:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Gaegu","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* ── 틀 ───────────────────────────── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.rail{background:var(--ink);color:#fff;display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 18px}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.01em;line-height:1.15}
.brand span{display:block;font-size:11.5px;color:#A9AEBD;margin-top:2px}
.steps{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.step{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:9px 8px;color:#C4C8D4}
.step:hover{background:#22242E}
.step .no{grid-row:1/3;font:600 12px var(--f-mono);width:34px;height:34px;display:grid;place-items:center;border:1.5px solid #4A4E5E;border-radius:4px;color:#C4C8D4}
.step .nm{font-weight:600;font-size:14px;line-height:1.25}
.step .meta{font-size:11.5px;color:#8C91A2;line-height:1.3}
.step.done .no{border-color:var(--blue-soft);color:var(--blue-soft)}
.step.on{background:#262833;color:#fff}
.step.on .no{background:var(--ppl);border-color:var(--ppl);color:var(--ink)}
.step.on .meta{color:#C4C8D4}
.rail-foot{margin-top:auto;padding:12px 10px 14px}
.conn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#22242E;border:1px solid #363947;border-radius:6px;padding:9px 10px;color:#fff}
.conn:hover{border-color:#5A5F73}
.conn i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--blue-soft)}
.conn.live i{background:#3DDC97}
.conn b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.conn small{display:block;font-size:11px;color:#9A9FB0;line-height:1.35;overflow-wrap:anywhere}

.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;height:54px;flex:none;padding:0 20px;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.pname{border:1px solid transparent;border-radius:5px;padding:5px 8px;font-weight:700;font-size:15px;background:transparent;min-width:0;flex:0 1 300px}
.pname:hover{border-color:var(--line)}
.sp{flex:1}
.batch{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;margin-right:6px}
.batch .bar{width:120px;height:8px;border:1.5px solid var(--ink);border-radius:2px;background:#fff;overflow:hidden}
.batch .bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.stage{flex:1;min-height:0;overflow:auto;padding:26px 30px 40px;background-color:var(--desk);background-image:radial-gradient(var(--blue-soft) 1px,transparent 1.3px);background-size:18px 18px}
.stage>*{max-width:1280px;margin-left:auto;margin-right:auto}

/* ── 공통 부품 ─────────────────────── */
.demobar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--blue-tint);border:1px solid var(--blue-soft);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:18px}
.demobar b{font-weight:700}
.lnk{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:20px}
.sh .no{font:600 11.5px var(--f-mono);letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.sh h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.15;letter-spacing:.005em;text-wrap:balance}
.sh .lead{color:var(--ink-2);max-width:60ch;margin-top:4px}
.sh-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.count{font:600 12.5px var(--f-mono);color:var(--ink-2);margin-right:4px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:15.5px;font-weight:700;line-height:1.3}
.sec .sub{color:var(--ink-3);font-size:13px;margin-top:-8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sticky{position:sticky;top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;padding:7px 14px;font-weight:600;font-size:13.5px;line-height:1.3;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--line-2)}
.btn.pri,.btn.gen{background:var(--ink);color:#fff}
.btn.pri:hover,.btn.gen:hover{background:#2C2E3A}
.btn.gen::before{content:"✦";font-size:11px;color:var(--ppl)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid transparent;border-radius:5px;background:none;color:var(--ink-2);padding:0;flex:none}
.icon:hover{background:var(--line-2);color:var(--ink)}
.icon.on{background:var(--ink);color:#fff}
.icon svg,.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lb{font-size:12px;font-weight:600;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.45}
.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;line-height:1.45}
.in:hover{border-color:#B4BAC6}
.in:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
textarea.in{resize:vertical;min-height:38px}
select.in{padding-right:26px}
.in.mono{font:500 12px/1.5 var(--f-mono)}
.fg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;line-height:1.4}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .sw{display:inline-flex}
.chip .sw i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.25);margin-left:-3px}
.chip .sw i:first-child{margin-left:0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;max-width:100%;flex-wrap:wrap}
.field>.seg,.opt>.seg{align-self:flex-start}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:5px 12px;font-size:13px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tag{display:inline-block;font:600 10.5px var(--f-mono);letter-spacing:.04em;padding:2px 6px;border-radius:3px;border:1px solid var(--ink);background:#fff;white-space:nowrap}
.tag.blue{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}
.tag.ppl{background:var(--ppl);border-color:var(--ink)}
mark{background:var(--ppl);color:var(--ink);padding:0 4px;border-radius:2px;font:600 10.5px var(--f-mono)}
.empty{border:1.5px dashed var(--blue);background:rgba(255,255,255,.75);border-radius:8px;padding:38px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-size:15px}
.empty p{color:var(--ink-2);max-width:46ch}
.note{background:var(--ppl-soft);border:1px solid #E6C200;border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:16px}
.fnav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
details>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
pre.raw{margin:8px 0 0;padding:10px;background:var(--desk);border-radius:6px;font:500 11.5px/1.55 var(--f-mono);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.busy{position:absolute;inset:0;background:rgba(255,255,255,.84);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;z-index:6}
svg.sk{display:block;width:100%;height:100%}

/* ── 01 브리프 ─────────────────────── */
.uploads{display:flex;flex-wrap:wrap;gap:8px}
.up{position:relative;width:76px;height:76px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff}
.up img{width:100%;height:100%;object-fit:contain}
.up .icon{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(255,255,255,.92);border-color:var(--line)}
.up-add{display:grid;place-items:center;width:76px;height:76px;border:1.5px dashed var(--ink-3);border-radius:4px;color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3}
.up-add:hover{border-color:var(--ink);background:#fff}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale button{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px}
.scale button:hover{border-color:var(--ink)}
.scale .bar{display:block;position:relative;height:30px;border:1.5px solid var(--ink);border-radius:2px;background:#fff;overflow:hidden}
.scale .bar i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--n)*20%);background:var(--ppl)}
.scale b{font-size:13px;line-height:1.3}
.scale small{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.scale button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ppl-soft)}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.chk li{display:flex;gap:8px;align-items:center;color:var(--ink-3)}
.chk li::before{content:"";width:13px;height:13px;border:1.5px solid var(--ink-3);border-radius:3px;flex:none}
.chk li.ok{color:var(--ink)}
.chk li.ok::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.sum{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.sum dt{color:var(--ink-3);font-weight:600;font-size:12px;padding-top:1px}
.sum dd{margin:0}

/* ── 02·03 캐릭터·배경 ─────────────── */
.promptbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 14px;margin-bottom:18px}
.promptbar .in{flex:1 1 240px;width:auto}
.promptbar .lb{flex:none}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.grid.bg{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ent{display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.pic{position:relative;display:block;width:100%;padding:0;border:0;border-bottom:1.5px solid var(--ink);background:#fff;overflow:hidden}
.pic.char{aspect-ratio:3/4}.pic.bg{aspect-ratio:16/9}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic .tag{position:absolute;left:8px;top:8px;z-index:2}
.ent-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.ent-h{display:flex;align-items:center;gap:8px}
.ent-h h3{font-size:16px;font-weight:700;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.ent-h .tag{flex:none}
.ent-h .icon{margin-left:auto}
.ent .meta{font-size:12px;color:var(--ink-3)}
.ent .desc{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ent .pplnote{font-size:12.5px;color:var(--ink-2)}
.ent-a{display:flex;gap:6px;margin-top:auto;padding-top:6px}

.dr-bg,.mo-bg{position:fixed;inset:0;background:rgba(21,22,28,.32);z-index:40}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);border-left:1.5px solid var(--ink);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(21,22,28,.16)}
.dr header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr header h2{font-size:16px;font-weight:700}
.dr-body{flex:1;overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:13px}
.dr .pic{border:1.5px solid var(--ink);border-radius:4px}
.dr .pic.char{max-width:240px;align-self:center}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.vars button{width:48px;height:48px;padding:0;border:1.5px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.vars button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--blue)}
.vars img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ── 04 시나리오 ───────────────────── */
.sc-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;height:78px;border-bottom:1.5px solid var(--ink)}
.tl button{display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:0;border:0;background:none}
.tl i{display:block;height:calc(var(--h)*1%);background:var(--ppl);border:1.5px solid var(--ink);border-bottom:0}
.tl i.z{height:4px;background:var(--line);border:0}
.tl button:hover i{filter:brightness(.93)}
.tl-x{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;margin-top:4px;font:500 10px var(--f-mono);color:var(--ink-3);text-align:center}
.tl-k{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink-3)}
.tl-k span{display:inline-flex;align-items:flex-end;gap:5px}
.tl-k i{display:inline-block;width:9px;height:calc(var(--h)*.14px);background:var(--ppl);border:1px solid var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font:600 18px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3)}
.stat.ok{border-color:var(--ok)}.stat.ok b{color:var(--ok)}
.stat.warn{border-color:var(--warn)}.stat.warn b{color:var(--warn)}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.hints li{display:flex;gap:8px;align-items:baseline}
.hints li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);transform:translateY(-1px)}
.hints li.ok::before{background:var(--ok)}
.cuts{display:flex;flex-direction:column;gap:14px}
.cut{display:grid;grid-template-columns:124px minmax(0,1fr) 208px;gap:16px;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:14px;scroll-margin-top:12px}
.cut-l{display:flex;flex-direction:column;gap:8px}
.cno{font:600 19px/1 var(--f-mono);letter-spacing:.02em}
.thumb{position:relative;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:#fff}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.mv{display:flex;gap:2px;flex-wrap:wrap}
.cut-m{display:flex;flex-direction:column;gap:11px;min-width:0}
.cut-r{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line);padding-left:16px;min-width:0}
.pplsel{display:flex;flex-direction:column;gap:3px}
.pplsel button{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:5px;background:none;padding:4px 7px;font-size:12.5px;text-align:left}
.pplsel button:hover{background:var(--line-2)}
.pplsel i{flex:none;width:26px;height:10px;border:1.5px solid var(--ink);border-radius:2px;background:linear-gradient(90deg,var(--ppl) calc(var(--h)*1%),#fff 0)}
.pplsel button.on{border-color:var(--ink);background:var(--ppl-soft);font-weight:600}
.rw{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:flex;gap:5px;align-items:center}
.ln select.in{flex:none;width:auto;padding:6px 22px 6px 7px;font-size:12.5px}
.ln input.in{flex:1;min-width:60px;padding:6px 9px}
.lines>.btn{align-self:flex-start}
.insp .ln{flex-wrap:wrap}
.insp .ln select.in{flex:1 1 0;min-width:0}
.insp .ln input.in{order:9;flex:1 1 100%}
.insp .ln .icon:first-of-type{margin-left:auto}

/* ── 05 웹툰 ───────────────────────── */
.wt{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:22px;align-items:start}
.strip-wrap{display:flex;justify-content:center}
.strip{width:min(460px,100%);background:#fff;border:1.5px solid var(--ink);container-type:inline-size;display:flex;flex-direction:column}
.gap{flex:none;background:#fff}
.panel{position:relative;container-type:inline-size;overflow:hidden;cursor:pointer;background:#fff}
.panel>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.panel>svg.sk{position:absolute;inset:0}
.panel.sel{outline:3px solid var(--blue);outline-offset:-3px}
.panel.sel::after{content:"";position:absolute;inset:0;border:3px solid var(--blue);pointer-events:none;z-index:5}
.ptags{position:absolute;left:6px;top:6px;display:flex;gap:4px;z-index:4;pointer-events:none}
.strip.clean .ptags{display:none}

async function refPart(id){
  const it=IMG.get(id);if(!it)return null;if(it.ref)return it.ref;
  const im=await loadImage(it.url);
  const s=Math.min(1,1024/Math.max(im.naturalWidth||1024,im.naturalHeight||1024));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.naturalWidth||1024)*s));c.height=Math.max(1,Math.round((im.naturalHeight||1024)*s));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  return it.ref={mimeType:'image/jpeg',data:c.toDataURL('image/jpeg',.9).split(',')[1]};
}

/* 말풍선 자동 배치: 위에서 아래로 좌우 번갈아, 내레이션은 모서리에 */
function autoLayout(cut){
  const topNarr=cut.lines.length>0&&cut.lines[0].type==='narr';
  let k=topNarr?1:0;
  cut.lines.forEach((ln,i)=>{
    if(ln.type==='sfx'){ln.x=70;ln.y=60;ln.w=70;ln.tail='none';return}
    if(ln.type==='narr'){const last=i>0&&i===cut.lines.length-1;ln.x=last?64:35;ln.y=last?91:9;ln.w=60;ln.tail='none';return}
    ln.x=k%2?70:30;ln.y=clamp(15+k*17,10,84);ln.w=46;ln.tail=k%2?'right':'left';k++;
  });
  return cut;
}

function pruneRefs(){
  const cs=new Set(S.project.characters.map(c=>c.id)),bs=new Set(S.project.backgrounds.map(b=>b.id));
  for(const cut of S.project.scenario.cuts){
    cut.chars=cut.chars.filter(id=>cs.has(id));
    if(!bs.has(cut.bg))cut.bg='';
    for(const ln of cut.lines)if(ln.who&&!cs.has(ln.who))ln.who='';
  }
}
function pplStats(){
  const p=S.project,cuts=p.scenario.cuts,n=cuts.length,lv=clamp(p.brief.pplLevel,1,5);
  const [lo,hi]=TARGET[lv-1];
  const exp=cuts.filter(c=>c.ppl>0).length;
  const share=n?Math.round(exp/n*100):0;
  const first=cuts.findIndex(c=>c.ppl>0);
  const names=[p.brief.product,p.brief.brand].map(s=>s.trim()).filter(s=>s.length>1);
  const mentions=cuts.reduce((a,c)=>a+c.lines.filter(l=>names.some(nm=>l.text.includes(nm))).length,0);
  const hero=cuts.filter(c=>c.ppl===4).length;
  let run=0,maxRun=0,runEnd=-1;
  cuts.forEach((c,i)=>{run=c.ppl>0?run+1:0;if(run>maxRun){maxRun=run;runEnd=i}});
  const state=!n?'none':share<lo?'low':share>hi?'high':'ok';
  return {n,exp,share,first,mentions,hero,lo,hi,state,maxRun,runEnd,lv};
}
function pplHints(){
  const st=pplStats(),b=S.project.brief,out=[];
  if(!st.n)return out;
  if(st.exp===0)out.push('제품이 한 번도 등장하지 않습니다. 노출할 컷을 골라 단계를 올려 주세요.');
  else if(st.state==='low')out.push(`노출 비율 ${st.share}%가 목표(${st.lo}–${st.hi}%)보다 낮습니다. 사용 장면을 한 컷 더 넣어 보세요.`);
  else if(st.state==='high')out.push(`노출 비율 ${st.share}%가 목표(${st.lo}–${st.hi}%)보다 높습니다. 일부 컷을 배경 노출로 낮추면 광고 느낌이 줄어듭니다.`);
  if(st.first===0&&st.lv<5)out.push('첫 컷부터 제품이 보이면 이야기에 몰입하기 전에 광고로 읽힐 수 있습니다.');
  if(st.maxRun>=3)out.push(`C${pad2(st.runEnd-st.maxRun+2)}–C${pad2(st.runEnd+1)} ${st.maxRun}컷 연속 노출입니다. 가운데 한 컷은 인물의 감정에 집중해도 좋습니다.`);
  if(st.exp>0&&st.mentions===0&&b.pplModes.includes('talk'))out.push('‘대사로 언급’을 골랐지만 대사에 제품명이 없습니다.');
  if(st.mentions>2)out.push(`대사에 제품명이 ${st.mentions}번 나옵니다. 한두 번이면 충분합니다.`);
  return out;
}

/* ═══ 10 · 블루 연필 러프(콘티)와 데모용 채색 러프 — SVG로 그립니다 ═══ */
const SK={blue:'#3FA2D4',blueL:'#A9D7EC',ink:'#15161C',ppl:'#FFD91A'};
const n1=v=>+(+v).toFixed(1);
function ratioWH(r){const [a,b]=String(r).split(':').map(Number);return a>=b?[400,Math.round(400*b/a)]:[Math.round(400*a/b),400]}

function Pen(seed,mode){
  const r=rng(seed),j=(a=1.4)=>(r()-.5)*2*a;
  const col=mode==='demo'?SK.ink:SK.blue,sw=mode==='demo'?1.7:1.5;
  const pt=(x,y,a=.9)=>`${n1(x+j(a))} ${n1(y+j(a))}`;
  return {
    r,j,col,sw,
    line(x1,y1,x2,y2,o={}){
      return `<path d="M${pt(x1,y1,.7)}Q${pt((x1+x2)/2,(y1+y2)/2,1.6)} ${pt(x2,y2,.7)}" fill="none" stroke="${o.c||col}" stroke-width="${o.w||sw}" stroke-linecap="round"/>`;
    },
    ell(cx,cy,rx,ry,o={}){
      const k=.5523;
      const d=`M${pt(cx-rx,cy)}C${pt(cx-rx,cy-ry*k)} ${pt(cx-rx*k,cy-ry)} ${pt(cx,cy-ry)}C${pt(cx+rx*k,cy-ry)} ${pt(cx+rx,cy-ry*k)} ${pt(cx+rx,cy)}C${pt(cx+rx,cy+ry*k)} ${pt(cx+rx*k,cy+ry)} ${pt(cx,cy+ry)}C${pt(cx-rx*k,cy+ry)} ${pt(cx-rx,cy+ry*k)} ${n1(cx-rx)} ${n1(cy)}Z`;
      return `<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c||col}" stroke-width="${o.w||sw}" stroke-linejoin="round"/>`;
    },
    poly(pts,o={}){
      const d='M'+pts.map(([x,y])=>pt(x,y)).join('L')+(o.open?'':'Z');
      return `<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c||col}" stroke-width="${o.w||sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    },
  };
}

/* 캐릭터 설정 글에서 러프용 생김새를 뽑습니다 */
function lookOf(c){
  const t=`${c.appearance||''} ${c.visual||''}`.toLowerCase(),o=`${c.outfit||''} ${c.visual||''}`.toLowerCase(),h=hash((c.id||'')+(c.name||''));
  const hair=/단발|bob/.test(t)?'bob':/긴 머리|긴머리|장발|long hair|웨이브|긴 생머리/.test(t)?'long':/묶|포니|bun|ponytail|올림머리/.test(t)?'tied':/짧|short|숏컷|커트/.test(t)?'short':(c.gender==='남성'?'short':['bob','long','tied'][h%3]);
  const hairC=/갈색|brown|브라운|밤색/.test(t)?'#6B4630':/금발|blond/.test(t)?'#D9B25F':/붉은|빨간|red hair|적갈/.test(t)?'#A8432F':/회색|은발|gray|grey|silver|백발/.test(t)?'#8D93A1':/검|black|흑발/.test(t)?'#22232B':['#22232B','#6B4630','#3A2E2A'][h%3];
  const tops=[[/베이지|beige|아이보리|크림/,'#D8C3A5'],[/네이비|남색|navy/,'#34466E'],[/흰|화이트|white/,'#F2F2EE'],[/검정|검은|블랙|black/,'#2B2E3A'],[/빨강|빨간|레드|red/,'#C8443C'],[/파랑|파란|블루|blue|하늘색/,'#3F74C4'],[/초록|녹색|그린|green|카키/,'#3F7F6B'],[/분홍|핑크|pink/,'#E79AAE'],[/회색|그레이|gray|grey/,'#9AA0AB'],[/보라|퍼플|purple/,'#7A5EA8'],[/주황|오렌지|orange/,'#E0813A']];
  const hit=tops.find(([re])=>re.test(o));
  const pool=['#D8C3A5','#34466E','#B5546A','#3F7F6B','#7A5EA8','#C8D3DD','#E0813A'];
  return {hair,hairC,skin:['#F6D7BF','#EFC6A6','#F9E0CC'][h%3],topC:hit?hit[1]:pool[(h>>>3)%pool.length],botC:['#2B2E3A','#5B6275','#8B7355','#1F2A44'][(h>>>6)%4],wide:c.gender==='남성'};
}

function can(pen,mode,x,y,w,h){
  const demo=mode==='demo';let s='';
  if(!demo)s+=`<rect x="${n1(x-w*.4)}" y="${n1(y-h*.14)}" width="${n1(w*1.8)}" height="${n1(h*1.28)}" fill="${SK.ppl}" opacity=".75" transform="rotate(-4 ${n1(x+w/2)} ${n1(y+h/2)})"/>`;
  s+=`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${n1(w*.2)}" fill="${demo?SK.ppl:'none'}" stroke="${pen.col}" stroke-width="${pen.sw}"/>`;
  s+=`<rect x="${n1(x)}" y="${n1(y+h*.34)}" width="${n1(w)}" height="${n1(h*.3)}" fill="${demo?'#fff':'none'}" stroke="${pen.col}" stroke-width="${n1(pen.sw*.8)}"/>`;
  return s;
}

/* 7등신 구조 인물. o:{cx,top,h,look,hold} */
function figure(pen,mode,o){
  const {cx,top,h,look}=o,demo=mode==='demo',F=c=>demo?c:'none',col=pen.col;
  const u=h/7,hr=u*.5,ry=hr*1.15,hy=top+ry;
  const sh=top+u*1.42,sw=u*(look.wide?1.02:.86),hip=top+u*3.7,foot=top+u*7;
  const P=a=>a.map(p=>`${n1(p[0])} ${n1(p[1])}`);
  let s='';
  const capL=cx-hr*1.12,capR=cx+hr*1.12,capT=hy-ry*1.3;
  const hp=d=>`<path d="${d}" fill="${F(look.hairC)}" stroke="${col}" stroke-width="${pen.sw}" stroke-linejoin="round"/>`;
  if(look.hair==='long')s+=hp(`M${n1(capL)} ${n1(hy)}C${n1(capL-hr*.25)} ${n1(hy+ry*1.6)} ${n1(capL)} ${n1(hy+ry*2.6)} ${n1(cx-hr*.9)} ${n1(hy+ry*2.9)}L${n1(cx+hr*.9)} ${n1(hy+ry*2.9)}C${n1(capR)} ${n1(hy+ry*2.6)} ${n1(capR+hr*.25)} ${n1(hy+ry*1.6)} ${n1(capR)} ${n1(hy)}Z`);
  if(look.hair==='bob')s+=hp(`M${n1(capL)} ${n1(hy-ry*.2)}C${n1(capL-hr*.2)} ${n1(hy+ry*.8)} ${n1(capL+hr*.1)} ${n1(hy+ry*1.3)} ${n1(cx-hr*.7)} ${n1(hy+ry*1.34)}L${n1(cx+hr*.7)} ${n1(hy+ry*1.34)}C${n1(capR-hr*.1)} ${n1(hy+ry*1.3)} ${n1(capR+hr*.2)} ${n1(hy+ry*.8)} ${n1(capR)} ${n1(hy-ry*.2)}Z`);
  if(look.hair==='tied')s+=pen.ell(cx+hr*.8,capT+ry*.15,hr*.42,hr*.42,{fill:F(look.hairC)});
  // 다리
  s+=pen.poly([[cx-sw*.72,hip-u*.15],[cx-sw*.56,foot],[cx-sw*.08,foot],[cx,hip+u*.55],[cx+sw*.08,foot],[cx+sw*.56,foot],[cx+sw*.72,hip-u*.15]],{fill:F(look.botC)});
  const arm=pts=>{
    const d='M'+P(pts).join('L');
    return demo
      ?`<path d="${d}" fill="none" stroke="${SK.ink}" stroke-width="${n1(u*.34+3.2)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${look.topC}" stroke-width="${n1(u*.34)}" stroke-linecap="round" stroke-linejoin="round"/>`
      :`<path d="${d}" fill="none" stroke="${col}" stroke-width="${pen.sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const hand=p=>pen.ell(p[0],p[1],u*.17,u*.17,{fill:F(look.skin)});
  const la=[[cx-sw*.95,sh+u*.14],[cx-sw*1.2,sh+u*1.25],[cx-sw*1.08,sh+u*2.25]];
  s+=arm(la)+hand(la[2]);
  // 목 → 몸통
  s+=demo?`<rect x="${n1(cx-hr*.32)}" y="${n1(hy+ry*.7)}" width="${n1(hr*.64)}" height="${n1(sh-(hy+ry*.7))}" fill="${look.skin}" stroke="${SK.ink}" stroke-width="1.5"/>`
        :pen.line(cx-hr*.3,hy+ry*.92,cx-hr*.3,sh-u*.1)+pen.line(cx+hr*.3,hy+ry*.92,cx+hr*.3,sh-u*.1);
  s+=pen.poly([[cx-sw,sh],[cx-sw*.32,sh-u*.14],[cx+sw*.32,sh-u*.14],[cx+sw,sh],[cx+sw*.74,hip],[cx-sw*.74,hip]],{fill:F(look.topC)});
  const ra=o.hold?[[cx+sw*.95,sh+u*.14],[cx+sw*1.24,sh+u*1.12],[cx+sw*.7,sh+u*.42]]:[[cx+sw*.95,sh+u*.14],[cx+sw*1.2,sh+u*1.25],[cx+sw*1.08,sh+u*2.25]];
  s+=arm(ra);
  if(o.hold)s+=can(pen,mode,ra[2][0]-u*.2,ra[2][1]-u*.66,u*.4,u*.72);
  s+=hand(ra[2]);
  // 머리, 앞머리, 얼굴
  s+=pen.ell(cx,hy,hr,ry,{fill:F(look.skin)});
  s+=hp(`M${n1(capL)} ${n1(hy+ry*.05)}C${n1(capL)} ${n1(capT-ry*.1)} ${n1(capR)} ${n1(capT-ry*.1)} ${n1(capR)} ${n1(hy+ry*.05)}C${n1(cx+hr*.6)} ${n1(hy-ry*.8)} ${n1(cx-hr*.1)} ${n1(hy-ry*.5)} ${n1(cx-hr*.55)} ${n1(hy-ry*.36)}C${n1(cx-hr*.8)} ${n1(hy-ry*.3)} ${n1(capL+hr*.1)} ${n1(hy-ry*.2)} ${n1(capL)} ${n1(hy+ry*.05)}Z`);
  if(demo){
    s+=`<ellipse cx="${n1(cx-hr*.38)}" cy="${n1(hy+ry*.14)}" rx="${n1(hr*.09)}" ry="${n1(hr*.15)}" fill="${SK.ink}"/><ellipse cx="${n1(cx+hr*.38)}" cy="${n1(hy+ry*.14)}" rx="${n1(hr*.09)}" ry="${n1(hr*.15)}" fill="${SK.ink}"/>`;
    s+=`<path d="M${n1(cx-hr*.2)} ${n1(hy+ry*.56)}Q${n1(cx)} ${n1(hy+ry*.7)} ${n1(cx+hr*.2)} ${n1(hy+ry*.56)}" fill="none" stroke="${SK.ink}" stroke-width="1.5" stroke-linecap="round"/>`;
  }else{
    s+=pen.line(cx,hy-ry*.95,cx,hy+ry*.95,{c:SK.blueL,w:1})+pen.line(cx-hr*.95,hy+ry*.12,cx+hr*.95,hy+ry*.12,{c:SK.blueL,w:1});
  }
  return s;
}

/* 배경: 소실점 격자 + 장소 유형별 구조물 */
function bgLayer(pen,mode,w,h,bg,soft){
  const demo=mode==='demo',t=bg?.time||'낮';
  const PAL={
    '낮':{sky:'#CFE9F7',wall:'#F4EFE4',floor:'#E3D9C6',obj:'#C9B79C',glow:'#FFF2C2',glass:'#E3F1F7',green:'#9CC5A1'},
    '저녁':{sky:'#FFCFA3',wall:'#F7E2D0',floor:'#E0BFA5',obj:'#C99A7A',glow:'#FFE3B0',glass:'#FFE9D2',green:'#A9B48A'},
    '밤':{sky:'#1F2A52',wall:'#39446E',floor:'#272E4E',obj:'#4C5887',glow:'#F9DC7A',glass:'#F7E7A6',green:'#3E5C63'},
    '새벽':{sky:'#BFCBEF',wall:'#DCE2F4',floor:'#BEC7E1',obj:'#9AA6CC',glow:'#FDF1CF',glass:'#E8EDFA',green:'#8FB3A8'},
  };
  const P=PAL[t]||PAL['낮'];
  const key=`${bg?.name||''} ${bg?.desc||''} ${bg?.visual||''}`.toLowerCase();
  const o={c:demo?SK.ink:(soft?SK.blueL:SK.blue),w:demo?1.4:1.2};
  const F=x=>demo?x:'none';
  const hz=h*.62,fl=h-hz;let s='';
  const box=(x,y,bw,bh,fill)=>pen.poly([[x,y],[x+bw,y],[x+bw,y+bh],[x,y+bh]],{...o,fill:F(fill)});
  const type=/사무실|오피스|회의|office|desk|작업실|스튜디오|교실|학교|도서관/.test(key)?'office'
    :/편의점|가게|카페|매장|상점|store|shop|cafe|식당|마트|베이커리|서점|약국/.test(key)?'store'
    :/거리|길|골목|street|역|승강장|정류장|도시|city|횡단보도|platform/.test(key)?'street'
    :/공원|옥상|정원|바다|해변|산|숲|야외|캠핑|park|garden|beach|강변|한강|rooftop/.test(key)?'outdoor':'room';
  const outside=type!=='office'&&type!=='room';
  if(demo)s+=`<rect width="${w}" height="${n1(hz)}" fill="${outside?P.sky:P.wall}"/><rect y="${n1(hz)}" width="${w}" height="${n1(fl)}" fill="${P.floor}"/>`;
  const vx=w*(.4+pen.r()*.2);
  for(let i=0;i<5;i++)s+=pen.line(vx,hz,w*(-.3+i*.4),h,{c:demo?'rgba(21,22,28,.16)':SK.blueL,w:1});
  s+=pen.line(0,hz,w,hz,o);
  if(outside){
    if(t==='저녁')s+=pen.ell(w*.82,hz-h*.05,h*.055,h*.055,{...o,fill:F(P.glow)});
    else s+=pen.ell(w*.85,h*.11,h*.045,h*.045,{...o,fill:F(P.glow)});
    if(t==='밤')for(let i=0;i<4;i++){const sx=w*(.1+pen.r()*.6),sy=h*(.05+pen.r()*.2);s+=`<path d="M${n1(sx-3)} ${n1(sy)}h6M${n1(sx)} ${n1(sy-3)}v6" stroke="${demo?P.glow:o.c}" stroke-width="1" stroke-linecap="round"/>`}
  }
  if(type==='office'){
    for(let i=0;i<3;i++)s+=box(w*(.07+i*.3),hz*.14,w*.25,hz*.52,P.sky);
    const dt=hz+fl*.3;
    s+=box(w*.2,dt-h*.15,w*.19,h*.105,t==='밤'?P.glow:P.glass)+pen.line(w*.295,dt-h*.045,w*.295,dt,o);
    s+=box(w*.05,dt,w*.52,fl*.14,P.obj)+pen.line(w*.09,dt+fl*.14,w*.09,h,o)+pen.line(w*.53,dt+fl*.14,w*.53,h,o);
  }else if(type==='store'){
    s+=box(w*.07,hz*.3,w*.86,hz*.7,P.glass)+box(w*.07,hz*.1,w*.86,hz*.18,P.obj);
    s+=box(w*.42,hz*.44,w*.16,hz*.56,demo?'#fff':'none');
    for(let i=0;i<3;i++)s+=pen.line(w*.11,hz*(.5+i*.16),w*.37,hz*(.5+i*.16),o);
    s+=box(w*.64,hz*.44,w*.23,hz*.56,demo?'#fff':'none')+pen.line(w*.755,hz*.44,w*.755,hz,o);
    const py=hz+fl*.12;
    s+=pen.poly([[w*.63,py+fl*.2],[w*.95,py+fl*.2],[w*.79,py]],{...o,fill:F('#E8EEF2')})+pen.line(w*.79,py+fl*.2,w*.79,py+fl*.72,o)+pen.line(w*.69,py+fl*.5,w*.89,py+fl*.5,o);
  }else if(type==='street'){
    for(let i=0;i<4;i++){
      const bh=hz*(.4+pen.r()*.5),bx=w*(.02+i*.25);
      s+=box(bx,hz-bh,w*.2,bh,P.obj)+box(bx+w*.04,hz-bh*.8,w*.045,bh*.16,P.glass)+box(bx+w*.115,hz-bh*.8,w*.045,bh*.16,P.glass);
    }
    s+=pen.line(w*.92,hz-h*.34,w*.92,hz+fl*.5,o)+pen.ell(w*.92,hz-h*.36,h*.02,h*.02,{...o,fill:F(P.glow)});
  }else if(type==='outdoor'){
    s+=`<path d="M0 ${n1(hz)}Q${n1(w*.3)} ${n1(hz-h*.14)} ${n1(w*.6)} ${n1(hz-h*.04)}T${w} ${n1(hz-h*.08)}" fill="none" stroke="${o.c}" stroke-width="${o.w}"/>`;
    for(let i=0;i<3;i++){const tx=w*(.14+i*.31),th=h*(.2+pen.r()*.08);s+=pen.line(tx,hz+fl*.1,tx,hz-th*.4,o)+pen.ell(tx,hz-th,h*.085,h*.1,{...o,fill:F(P.green)})}
    s+=box(w*.56,hz+fl*.3,w*.3,fl*.1,P.obj);
  }else{
    s+=box(w*.56,hz*.16,w*.32,hz*.48,P.sky)+pen.line(w*.72,hz*.16,w*.72,hz*.64,o)+pen.line(w*.56,hz*.4,w*.88,hz*.4,o);
    s+=box(w*.07,hz-h*.03,w*.4,h*.15,P.obj)+box(w*.07,hz-h*.11,w*.4,h*.08,P.obj);
    s+=box(w*.56,hz+fl*.34,w*.32,fl*.13,P.obj);
  }
  return s;
}

function svgWrap(w,h,inner,mode,label){

  const cap=label?`<text x="10" y="${h-10}" font-family="monospace" font-size="9" fill="${demo?SK.ink:SK.blue}" opacity=".85">${esc(label)}</text>`:'';

}

function bgSVG(b,mode='rough',salt=''){

function cutSVG(cut,mode='rough',salt=''){
  const [w,h]=ratioWH(S.project.brief.ratio),pen=Pen(hash(cut.id+salt+mode),mode);
  const bg=bgById(cut.bg);
  let s=bgLayer(Pen(hash((bg?.id||'nobg')+mode),mode),mode,w,h,bg,true);
  const chars=cut.chars.map(charById).filter(Boolean).slice(0,3);
  const conf={wide:{fh:.6,top:.32},medium:{fh:1.55,top:.2},close:{fh:3.0,top:.17},xclose:{fh:4.6,top:.04},ots:{fh:1.9,top:.2},high:{fh:.8,top:.26},low:{fh:1.3,top:.14}}[cut.shot];
  const n=chars.length;
  if(conf&&n){
    const k=n>1&&cut.shot!=='wide'&&cut.shot!=='high'?.8:1;
    chars.forEach((c,i)=>{
      const cx=w*(n===1?.5:n===2?[.31,.69][i]:[.2,.5,.8][i]);

    });
  }

  if(cut.ppl===1||((cut.ppl===2||cut.ppl===3)&&noHolder))s+=can(pen,mode,w*.8,h*.6,w*.07,w*.12);
  if(cut.ppl===4||(cut.shot==='insert'&&cut.ppl>0))s+=can(pen,mode,w*.6,h*.5,w*.24,w*.42);
  const i=S.project.scenario.cuts.indexOf(cut);
  return svgWrap(w,h,s,mode,`${mode==='demo'?'DEMO':'ROUGH'} · C${pad2(i+1)} ${shotOf(cut.shot).ko}`);
}

/* ═══ 20 · Gemini 연동, 프롬프트 조립, 데모 생성기 ═══ */
class ApiError extends Error{constructor(status,message,kind){super(message);this.status=status;this.kind=kind||'http'}}
const modelPath=m=>String(m).trim().replace(/^models\//,'');
const apiBase=()=>S.settings.base.trim().replace(/\/+$/,'');

async function apiFetch(path,init={},signal){
  const headers={'x-goog-api-key':S.settings.apiKey.trim(),...(init.body?{'Content-Type':'application/json'}:{})};
  for(let attempt=0;;attempt++){
    let res;
    try{res=await fetch(apiBase()+path,{...init,headers,signal})}
    catch(e){if(e.name==='AbortError')throw e;throw new ApiError(0,e.message,'network')}
    if(res.ok)return res.json();
    const j=await res.json().catch(()=>null);
    const msg=j?.error?.message||res.statusText||`HTTP ${res.status}`;
    if((res.status===429||res.status>=500)&&attempt<2){await sleep(1600*(attempt+1)**2,signal);continue}
    throw new ApiError(res.status,msg);
  }
}
const generate=(model,body,signal)=>apiFetch(`/models/${modelPath(model)}:generateContent`,{method:'POST',body:JSON.stringify(body)},signal);

function explain(e){
  if(e?.kind==='network')return 'Gemini 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요. 채팅 안 미리보기 창에서는 외부 API 호출이 막혀 있으니, 파일을 내려받아 Chrome 같은 브라우저에서 직접 열어야 합니다.';
  if(e?.kind==='blocked')return `안전 정책으로 생성이 막혔습니다 (${e.message}). 표현을 바꿔 다시 시도해 주세요.`;
  if(e?.kind==='empty')return e.message;
  const s=e?.status,m=e?.message||'';
  if(s===400&&/api key/i.test(m))return 'API 키가 올바르지 않습니다. Gemini 연결 설정에서 키를 다시 확인해 주세요.';
  if(s===401||s===403)return `이 키로는 요청이 거부되었습니다. 키 권한이나 결제 설정을 확인해 주세요. (${m})`;
  if(s===404)return `모델을 찾을 수 없습니다. Gemini 연결 설정에서 ‘연결 확인’을 눌러 사용할 수 있는 모델을 골라 주세요. (${m})`;
  if(s===429)return '요청 한도를 넘었습니다. 잠시 뒤 다시 시도하거나 동시 생성 수를 줄여 주세요.';
  if(s>=500)return 'Gemini 서버가 일시적으로 응답하지 않습니다. 잠시 뒤 다시 시도해 주세요.';
  return m||'알 수 없는 오류가 발생했습니다.';
}
const isFatal=e=>e?.kind==='network'||[401,403,404].includes(e?.status)||(e?.status===400&&/api key/i.test(e?.message||''));

function candidateParts(data){
  const br=data?.promptFeedback?.blockReason;
  if(br)throw new ApiError(0,br,'blocked');
  const c=data?.candidates?.[0];
  return {parts:(c?.content?.parts||[]).filter(p=>!p.thought),finish:c?.finishReason||''};
}
function parseJSON(text){
  let t=String(text).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(t)}catch(_){}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(_){}}
  throw new ApiError(0,'모델이 형식에 맞지 않는 답을 보냈습니다. 다시 시도해 주세요.','empty');
}
/* 텍스트 → JSON. 스키마를 거부하는 모델이면 스키마 없이 한 번 더 */
async function genJSON({system,prompt,schema,signal}){
  const body=withSchema=>({
    systemInstruction:{parts:[{text:system}]},
    contents:[{role:'user',parts:[{text:prompt}]}],
    generationConfig:{responseMimeType:'application/json',...(withSchema?{responseSchema:schema}:{})},
  });
  let data;
  try{data=await generate(S.settings.textModel,body(true),signal)}
  catch(e){if(e.status===400&&!/api key/i.test(e.message))data=await generate(S.settings.textModel,body(false),signal);else throw e}
  const {parts,finish}=candidateParts(data);
  const text=parts.map(p=>p.text||'').join('');
  if(!text.trim())throw new ApiError(0,`모델이 빈 답을 보냈습니다${finish?` (${finish})`:''}. 다시 시도해 주세요.`,'empty');
  return parseJSON(text);
}
/* 이미지 생성. 화면비 설정 필드는 모델 세대마다 달라서 400이면 다음 형식으로 넘어갑니다 */
const IMG_VARIANT={};
async function genImage({prompt,refs=[],ratio,signal}){
  const model=S.settings.imageModel,size=S.settings.imageSize;
  const parts=[];
  refs.forEach((r,i)=>{parts.push({text:`Image ${i+1}: ${r.label}`});parts.push({inlineData:r.data})});
  parts.push({text:prompt});
  const variants=[
    g=>{g.imageConfig={aspectRatio:ratio,imageSize:size}},
    g=>{g.imageConfig={aspectRatio:ratio}},
    g=>{g.responseFormat={image:{aspectRatio:ratio,imageSize:size}}},
    ()=>{},
  ];
  const vk=model+'|'+size;
  for(let i=IMG_VARIANT[vk]??0;i<variants.length;i++){
    const gc={responseModalities:['TEXT','IMAGE']};variants[i](gc);
    let data;
    try{data=await generate(model,{contents:[{role:'user',parts}],generationConfig:gc},signal)}
    catch(e){if(e.status===400&&!/api key/i.test(e.message)&&i<variants.length-1)continue;throw e}
    IMG_VARIANT[vk]=i;
    const {parts:out,finish}=candidateParts(data);
    const im=out.map(p=>p.inlineData||p.inline_data).find(Boolean);
    if(!im?.data){
      const said=out.map(p=>p.text||'').join(' ').trim().slice(0,140);
      if(/SAFETY|PROHIBITED|BLOCK/i.test(finish))throw new ApiError(0,finish,'blocked');
      throw new ApiError(0,`이미지가 돌아오지 않았습니다${finish?` (${finish})`:''}.${said?` 모델의 답: ${said}`:''}`,'empty');
    }
    return putB64(im.data,im.mimeType||im.mime_type||'image/png','gen');
  }
}
async function listModels(signal){
  const data=await apiFetch('/models?pageSize=200',{},signal);
  const all=(data.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>modelPath(m.name));
  const image=all.filter(n=>/image|banana/i.test(n));
  const text=all.filter(n=>!/image|banana|tts|audio|live|embedding|veo|lyria|robotics|computer-use|research|aqa|omni/i.test(n));
  return {text,image,total:all.length};
}

function scenarioPrompt(){

function rewritePrompt(cut,instr){
  const p=S.project,b=p.brief,lang=LANGS[b.lang],i=p.scenario.cuts.indexOf(cut);
  const cid=id=>'c'+(p.characters.findIndex(c=>c.id===id)+1),bid=id=>'b'+(p.backgrounds.findIndex(x=>x.id===id)+1);
  const story=p.scenario.cuts.map((c,k)=>`C${pad2(k+1)} [${bgById(c.bg)?.name||'-'}] ${c.action} ${c.lines.map(l=>`"${l.text}"`).join(' ')} (ppl ${c.ppl})`).join('\n');
  const cur={bg:bid(cut.bg),chars:cut.chars.map(cid),shot:cut.shot,action:cut.action,lines:cut.lines.filter(l=>l.type!=='sfx').map(l=>({who:l.who?cid(l.who):'',type:l.type,text:l.text})),sfx:cut.lines.find(l=>l.type==='sfx')?.text||'',pplLevel:cut.ppl,pplNote:cut.pplNote,visual:cut.visual};
  return `[BRIEF]\n${briefBlock()}\n\n[CHARACTERS]\n${p.characters.map((c,k)=>`- id c${k+1} | ${c.name} | ${c.personality} | speech: ${c.speech}`).join('\n')}\n\n[LOCATIONS]\n${p.backgrounds.map((x,k)=>`- id b${k+1} | ${x.name}`).join('\n')}\n\n[EPISODE SO FAR: ${p.scenario.title}]\n${story}\n\n[CUT TO REWRITE: C${pad2(i+1)}]\n${JSON.stringify(cur)}\n\n[INSTRUCTION]\n${instr}\n\nRewrite only this cut so it follows the instruction and still connects to the cuts before and after it. Keep the same JSON shape: bg, chars, shot (wide|medium|close|xclose|ots|high|low|insert), action, lines[{who,type(say|think|shout|narr),text}], sfx, pplLevel (0-4), pplNote, visual (English). Story text in ${lang}, each line at most 28 characters.`;
}

function normChar(r){

    personality:r.personality||'',appearance:r.appearance||'',outfit:r.outfit||'',speech:r.speech||'',pplLink:r.pplLink||'',visual:r.visual||''});
}
function normBg(r){return newBg({name:String(r.name||'').trim()||'이름 없는 장소',desc:r.desc||'',time:TIMES.includes(r.time)?r.time:'낮',mood:r.mood||'',pplSpot:r.pplSpot||'',visual:r.visual||''})}
function normCut(r){
  const p=S.project;
  const cid=a=>{const m=/^c(\d+)$/i.exec(String(a||'').trim());if(m)return p.characters[+m[1]-1]?.id||'';return p.characters.find(c=>c.name===a)?.id||''};
  const bid=a=>{const m=/^b(\d+)$/i.exec(String(a||'').trim());if(m)return p.backgrounds[+m[1]-1]?.id||'';return p.backgrounds.find(x=>x.name===a)?.id||''};
  const types=['say','think','shout','narr'];
  const lines=(Array.isArray(r.lines)?r.lines:[]).filter(l=>String(l?.text||'').trim()).slice(0,4).map(l=>{
    const who=cid(l.who);const type=types.includes(l.type)?l.type:(who?'say':'narr');
    return newLine({who:type==='narr'?'':who,type,text:String(l.text).trim()});
  });
  if(String(r.sfx||'').trim())lines.push(newLine({type:'sfx',text:String(r.sfx).trim(),tail:'none'}));
  const ppl=clamp(Math.round(Number(r.pplLevel)||0),0,4);
  return autoLayout(newCut({bg:bid(r.bg)||p.backgrounds[0]?.id||'',chars:[...new Set((Array.isArray(r.chars)?r.chars:[]).map(cid).filter(Boolean))].slice(0,3),
    shot:SHOTS.some(s=>s.id===r.shot)?r.shot:'medium',action:r.action||'',lines,ppl,pplNote:ppl?String(r.pplNote||''):'',visual:r.visual||''}));
}

/* 컷 한 장을 그릴 때 넘길 참조 이미지 목록과 프롬프트 */
function cutPlan(cut){
  const p=S.project,b=p.brief,st={en:styleText()},refs=[];
  const real=id=>id&&IMG.has(id)&&imgKind(id)!=='demo';
  const chars=cut.chars.map(charById).filter(Boolean);
  const charLines=chars.map(c=>{
    if(real(c.image)){refs.push({kind:'char',name:c.name,img:c.image,label:`character sheet of "${c.name}" — keep this exact face, hair and outfit`});return `- ${c.name} (see Image ${refs.length}): ${c.visual||c.appearance}`}
    return `- ${c.name}: ${c.visual||''} ${c.appearance||''} Outfit: ${c.outfit||'-'}`;
  });
  const bg=bgById(cut.bg);let bgLine='Location: unspecified, keep it simple.';
  if(bg){
    bgLine=`Location: ${bg.name} — ${bg.desc||''} Time: ${bg.time}. Mood: ${bg.mood||'-'}.`;
    if(real(bg.image)){refs.push({kind:'bg',name:bg.name,img:bg.image,label:`location reference for "${bg.name}"`});bgLine+=` Match the location in Image ${refs.length}, moving the camera to suit the shot.`}
    else bgLine+=` Visual tags: ${bg.visual||'-'}`;
  }
  let ppl='Product placement: none. Do not show any branded product in this panel.';
  if(cut.ppl>0){
    const how=[,`The product "${b.product}" appears naturally as a background prop. It is small but recognizable.`,`A character is naturally using or holding the product "${b.product}", label toward the camera.`,`The product "${b.product}" is clearly visible while a character talks about it.`,`Hero close-up: the product "${b.product}" is the visual focus of the panel, label fully legible, attractive lighting.`][cut.ppl];
    ppl=`Product placement: ${how}${cut.pplNote?` Staging: ${cut.pplNote}.`:''}`;
    const pid=b.productImages.find(real);
    if(pid){refs.push({kind:'product',name:b.product,img:pid,label:`PRODUCT reference for "${b.product}"`});ppl+=` Reproduce the product exactly as in Image ${refs.length}: same shape, colors and label.`}
    else ppl+=` Product appearance: ${b.desc||'-'}.`;
  }
  const beat=cut.lines.filter(l=>l.type!=='sfx').map(l=>l.text).join(' / ');
  const prompt=[
    'Create ONE finished webtoon panel: a single illustration with no panel borders or gutters.',
    `Art style: ${st.en}. Keep line weight, coloring and character designs consistent with the reference images.`,
    `Aspect ratio ${b.ratio}.`,
    bgLine,
    `Shot: ${shotOf(cut.shot).en}.`,
    `Action: ${cut.action||'-'}`,
    cut.visual?`Direction: ${cut.visual}`:'',
    chars.length?`Characters in this panel:\n${charLines.join('\n')}`:'No characters in this panel.',
    beat?`Emotional beat (do NOT draw these words): ${beat}`:'',
    ppl,
    `Rules: no speech bubbles, no captions, no sound-effect lettering, no watermark, no text of any kind except what is printed on the product itself. Leave calm, uncluttered space in the upper third so lettering can be added later.${b.avoid.trim()?` Never depict: ${b.avoid.trim()}.`:''}`,
  ].filter(Boolean).join('\n');
  return {refs,prompt};
}

/* ── 05 웹툰 ── */
const BUB={
  say:{fs:3.7,px:1.25,py:.8,font:'bubble',weight:400},
  think:{fs:4.3,px:1.2,py:.7,font:'hand',weight:700},
  shout:{fs:4.4,px:1.9,py:1.5,font:'display',weight:400},
  narr:{fs:3.3,px:.85,py:.6,font:'body',weight:500},
  sfx:{fs:8.5,px:0,py:0,font:'display',weight:400},
};
const BURST=(()=>{const r=rng(77),pts=[];for(let k=0;k<28;k++){const a=k*Math.PI/14,rad=k%2?39+r()*3:50-r()*2.5;pts.push([n1(50+rad*Math.cos(a)),n1(50+rad*Math.sin(a))])}return pts})();
const TAIL={left:{line:'M2 0L4 17L18 0',patch:'M3.1 0L4.6 12.5L6.5 12.5L17 0Z'},right:{line:'M18 0L16 17L2 0',patch:'M16.9 0L15.4 12.5L13.5 12.5L3 0Z'}};
function bubbleHTML(ln,cut){
  if(!String(ln.text).trim())return '';
  const t=BUB[ln.type]?ln.type:'say',B=BUB[t];
  const shape={say:'<ellipse cx="50" cy="50" rx="49.5" ry="49.5"/>',think:'<ellipse cx="50" cy="50" rx="49.5" ry="49.5"/>',shout:`<polygon points="${BURST.map(p=>p.join(',')).join(' ')}"/>`,narr:'<rect x=".5" y=".5" width="99" height="99"/>'}[t];
  const dir=ln.tail==='right'?'right':ln.tail==='left'?'left':'';
  let tail='';
  if(dir&&t==='say')tail=`<svg class="tail ${dir}" viewBox="0 0 20 18" aria-hidden="true"><path d="${TAIL[dir].line}"/></svg><svg class="tail patch ${dir}" viewBox="0 0 20 18" aria-hidden="true"><path d="${TAIL[dir].patch}"/></svg>`;
  if(dir&&t==='think')tail=`<span class="dots ${dir}"><i></i><i></i></span>`;
  return `<div class="bub b-${t}" data-line="${ln.id}" data-cut="${cut.id}" style="left:${ln.x}%;top:${ln.y}%;max-width:${ln.w}%;font:${B.weight} ${B.fs}cqw/1.35 var(--f-${B.font});padding:${B.py}em ${B.px}em">${shape?`<svg class="shape" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${shape}</svg>`:''}${tail}<span class="tx">${esc(ln.text)}</span></div>`;
}
function panelInner(cut){
  const i=S.project.scenario.cuts.indexOf(cut);
  return `${cut.image?`<img src="${imgURL(cut.image)}" alt="C${pad2(i+1)}: ${esc(cut.action)}">`:cutSVG(cut)}
    <div class="ptags"><span class="tag">C${pad2(i+1)}</span>${cut.image?kindTag(cut.image):'<span class="tag blue">러프</span>'}${cut.ppl?`<span class="tag ppl">PPL · ${PPL[cut.ppl].short}</span>`:''}</div>
    ${cut.lines.map(ln=>bubbleHTML(ln,cut)).join('')}${busyHTML(cut.id)}`;
}
function titleCardHTML(){
  const p=S.project,d=disclosureText();
  if(!p.export.title)return d?`<div class="tcard slim"><span class="disc">${esc(d)}</span></div>`:'';
  return `<div class="tcard">${d?`<span class="disc">${esc(d)}</span>`:''}<div class="tc-t"><b>${esc(p.scenario.title||p.name)}</b>${p.scenario.logline?`<span>${esc(p.scenario.logline)}</span>`:''}</div></div>`;
}
function endCardHTML(){
  const p=S.project,b=p.brief,d=disclosureText();if(!p.export.end)return '';
  const pid=b.productImages[0];
  return `<div class="ecard"><div class="ec-l"><small>제작 지원</small><b>${esc(b.brand||'브랜드')}</b><em>${esc(b.product)}</em><span>${esc(b.usp)}</span></div>${pid?`<img class="ec-img" src="${imgURL(pid)}" alt="${esc(b.product)}">`:''}${d?`<span class="ec-d">${esc(d)}</span>`:''}</div>`;
}
function stripHTML(sel){
  const p=S.project,cuts=p.scenario.cuts,g=`<div class="gap" style="height:${n1(p.export.gap/7.2)}cqw"></div>`;
  const parts=[];
  const t=titleCardHTML();if(t)parts.push(t+(p.export.title?g:''));
  parts.push(cuts.map(c=>`<div class="panel ${c.id===sel?'sel':''}" data-act="selCut" data-id="${c.id}" data-live="panel" style="aspect-ratio:${ratioCSS()}">${panelInner(c)}</div>`).join(g));
  const e=endCardHTML();if(e)parts.push(g+e);
  return parts.join('');
}
function inspHTML(cut){

  <div class="row"><button type="button" class="btn gen" data-act="genCut" data-id="${cut.id}" ${busy?'disabled':''}>${cut.image?'이 컷 다시 그리기':'이 컷 그리기'}</button>
    <label class="btn sm" tabindex="0">직접 그린 그림 올리기<input type="file" accept="image/*" hidden data-file="cut" data-id="${cut.id}"></label></div>
  ${cut.variants.length>1?`<div class="field"><span class="lb">지금까지 그린 그림</span><div class="vars">${cut.variants.map(v=>`<button type="button" class="${v===cut.image?'on':''}" data-act="pickCutVariant" data-id="${cut.id}" data-img="${v}" aria-label="이 그림 사용"><img src="${imgURL(v)}" alt=""></button>`).join('')}</div></div>`:''}
  <div class="field"><span class="lb">함께 넘기는 참조 이미지</span><div class="refs">${want.map(w=>`<span class="ref ${usable(w.img)?'':'miss'}">${usable(w.img)?`<img src="${imgURL(w.img)}" alt="">`:'<span class="ph"></span>'}${esc(w.label)}</span>`).join('')||'<span class="hint">이 컷에는 참조할 대상이 없습니다.</span>'}</div>
    ${miss?`<p class="hint">점선으로 표시된 ${miss}개는 ${isDemo()?'아직 그림이 없습니다':'아직 완성 그림이 없어 글 설명만 전달됩니다'}. 먼저 그려 두면 컷마다 생김새가 같게 유지됩니다.</p>`:''}</div>
  ${fArea('연출·행동',base+'.action',2)}
  <div class="field"><span class="lb">말풍선</span>${linesEditor(cut,i,true)}<p class="hint">원고 위에서 말풍선을 끌어 위치를 옮길 수 있습니다.</p><div class="row"><button type="button" class="btn sm" data-act="autoLayoutCut" data-id="${cut.id}">자동 배치</button></div></div>
  <details data-keep="cutPrompt" ${S.ui.open.cutPrompt?'open':''}><summary>이미지 프롬프트</summary>
    <textarea class="in mono" style="margin-top:8px" rows="12" id="cut-prompt" data-bind="${base}.promptOverride" aria-label="이미지 프롬프트">${esc(cut.promptOverride||plan.prompt)}</textarea>
    <p class="hint" style="margin-top:6px">${cut.promptOverride?'직접 고친 프롬프트를 사용합니다.':'브리프, 캐릭터, 배경, 연출에서 자동으로 조합됩니다. 고치면 이 컷에만 적용됩니다.'}</p>
    ${cut.promptOverride?`<div class="row" style="margin-top:6px"><button type="button" class="btn sm" data-act="resetPrompt" data-id="${cut.id}">자동 조합으로 되돌리기</button></div>`:''}
  </details>`;

VIEWS.webtoon=()=>{
  const cuts=S.project.scenario.cuts,n=cuts.length;

/* ── 06 검수·내보내기 ── */
function reviewChecks(){
  const p=S.project,b=p.brief,st=pplStats(),cuts=p.scenario.cuts,n=cuts.length,out=[];
  const d=disclosureText();
  out.push(d?{state:'ok',title:'광고 표기',msg:`“${d}” 문구가 원고 ${p.export.title?'제목 카드':'맨 위'}${p.export.end?'와 엔드 카드':''}에 들어갑니다.`}
            :{state:'bad',title:'광고 표기',msg:'광고 표기가 꺼져 있습니다. 대가를 받은 콘텐츠라면 표기가 필요합니다.',go:'brief'});
  if(n){
    out.push(st.state==='ok'?{state:'ok',title:'노출 비율',msg:`${st.exp}/${st.n}컷(${st.share}%)으로 목표 ${st.lo}–${st.hi}% 안에 있습니다.`}
      :{state:'warn',title:'노출 비율',msg:`${st.exp}/${st.n}컷(${st.share}%)으로 목표 ${st.lo}–${st.hi}%를 ${st.state==='low'?'밑돕니다':'넘습니다'}.`,go:'scenario'});
    const done=cuts.filter(c=>c.image&&imgKind(c.image)!=='demo').length;
    out.push(done===n?{state:'ok',title:'컷 그림',msg:`${n}컷 모두 그림이 준비됐습니다.`}:{state:'warn',title:'컷 그림',msg:`${n}컷 중 ${done}컷만 완성 그림입니다. 나머지는 러프나 데모 그림으로 내보내집니다.`,go:'webtoon'});
    const long=cuts.reduce((a,c)=>a+c.lines.filter(l=>l.type!=='sfx'&&l.text.length>32).length,0);
    out.push(long?{state:'warn',title:'말풍선 길이',msg:`32자를 넘는 말풍선이 ${long}개 있습니다. 모바일에서 읽기 어려울 수 있습니다.`,go:'scenario'}:{state:'ok',title:'말풍선 길이',msg:'모든 말풍선이 32자 이내입니다.'});
  }else out.push({state:'bad',title:'원고',msg:'아직 시나리오가 없습니다.',go:'scenario'});
  if(n&&st.exp>0)out.push(b.productImages.length?{state:'ok',title:'제품 참조',msg:'제품 사진을 참조해 그렸습니다. 라벨 글자와 색을 최종 확인해 주세요.'}:{state:'warn',title:'제품 참조',msg:'제품 사진 없이 글 설명만으로 그렸습니다. 실제 패키지와 다를 수 있습니다.',go:'brief'});
  return out;
}
const splitItems=s=>String(s||'').split(/[,\n，、]/).map(x=>x.trim()).filter(Boolean);

      ${manual.length?`<div class="field"><span class="lb">브리프 조건 — 원고를 보며 직접 확인</span><div class="manual">${manual.map(m=>`<label><input type="checkbox" data-manual="${esc(m.k)}" ${ex.manual[m.k]?'checked':''}>${esc(m.t)}</label>`).join('')}</div></div>`:''}

    </section>

      <div class="opt"><span class="lb">엔드 카드 (브랜드·제품)</span>${seg('project.export.end',[{id:true,ko:'넣기'},{id:false,ko:'빼기'}],{bool:1})}</div>
      <div class="opt"><span class="lb">컷 사이 간격</span>${seg('project.export.gap',[{id:0,ko:'없음'},{id:20,ko:'좁게'},{id:40,ko:'보통'},{id:90,ko:'넓게'}],{num:1})}</div>
      <div class="opt"><span class="lb">가로 폭</span>${seg('project.export.width',[{id:720,ko:'720px'},{id:1080,ko:'1080px'}],{num:1})}</div>
    </section>
    <section class="card sec"><h2>파일로 저장</h2>
      <div class="row"><button type="button" class="btn pri" data-act="exportPNG" ${n?'':'disabled'}>세로 원고 PNG</button><button type="button" class="btn" data-act="exportScript" ${n?'':'disabled'}>시나리오 텍스트</button><button type="button" class="btn" data-act="saveProject">프로젝트 파일</button></div>
      <p class="hint">프로젝트 파일에는 설정과 그린 이미지가 모두 들어 있어 ‘불러오기’로 이어서 작업할 수 있습니다. API 키는 저장하지 않습니다.</p>
    </section>
  </div>
  <aside class="card sec"><h2>원고 미리보기</h2><div class="exprev" id="exPrev" data-scroll="exprev"><p>${n?'미리보기를 그리는 중…':'시나리오를 만들면 여기에 원고가 보입니다.'}</p></div><p class="hint" id="exInfo"></p></aside></div>`;
};

function modelSelect(kind,label){
  const key=kind+'Model',cur=modelPath(S.settings[key]);
  const base=S.models?.[kind]?.length?S.models[kind]:(kind==='text'?TEXT_MODELS:IMAGE_MODELS);
  const opts=[...new Set([cur,...base])].filter(Boolean),custom=S.ui.custom[kind];
  return `<div class="field"><label class="lb" for="st-${kind}">${label}</label>
    ${custom?`<div class="rowin"><input class="in mono" id="st-${kind}" data-bind="settings.${key}" value="${esc(cur)}" spellcheck="false"><button type="button" class="btn sm" data-act="customModel" data-kind="${kind}" data-on="0">목록</button></div>`
      :`<select class="in" id="st-${kind}" data-model="${kind}">${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}<option value="__custom">직접 입력…</option></select>`}</div>`;
}
function modalHTML(){

let composing=false,pendingRender=false;
function captureFocus(){
  const a=document.activeElement;if(!a||!a.dataset||!a.dataset.bind)return null;
  let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd}catch(_){}
  return {k:a.dataset.bind,s,e};
}
function restoreFocus(f){
  if(!f)return;const el=document.querySelector(`[data-bind="${CSS.escape(f.k)}"]`);if(!el)return;
  el.focus({preventScroll:true});try{if(f.s!=null)el.setSelectionRange(f.s,f.e)}catch(_){}
}
function render(){
  if(composing){pendingRender=true;return}
  const f=captureFocus(),sc={};
  $$('[data-scroll]').forEach(el=>{sc[el.dataset.scroll]=el.scrollTop});
  $('#rail').innerHTML=railHTML();
  $('#top').innerHTML=topHTML();
  const main=$('#main'),changed=main.dataset.step!==S.step;
  main.innerHTML=(isDemo()?demoBarHTML():'')+VIEWS[S.step]()+footNav();
  if(changed){main.dataset.step=S.step;main.scrollTop=0}
  $('#drawer').innerHTML=drawerHTML();
  $('#modal').innerHTML=modalHTML();
  $$('[data-scroll]').forEach(el=>{if(sc[el.dataset.scroll]!=null)el.scrollTop=sc[el.dataset.scroll]});
  restoreFocus(f);
  if(S.step==='export')refreshExportPreview();
}

}

const clearBusy=id=>{BUSY.delete(id)};

function closeConfirm(v){const m=S.ui.modal;S.ui.modal=null;render();m?.resolve?.(v)}

/* ── 설계(글) ── */
async function design(kind,skipConfirm){
  const K=KIND[kind],key='design-'+kind;if(BUSY.has(key))return;
  if(needBrief())return;
  const list=S.project[K.list],keep=list.filter(e=>e.locked),want=S.project.brief[K.nKey],n=want-keep.length;
  if(n<=0){toast(`잠근 ${josa(K.label,'이/가')} 이미 ${keep.length}${K.unit}입니다. 수를 늘리거나 잠금을 풀어 주세요.`,'error');return}
  const drop=list.length-keep.length;
  if(!skipConfirm&&drop){
    const ok=await confirmBox({title:`${josa(K.label,'을/를')} 새로 설계할까요?`,msg:`잠그지 않은 ${K.label} ${drop}${K.unit}이 새 설계로 바뀝니다. 남기고 싶은 항목은 카드의 자물쇠를 먼저 켜 주세요.`,ok:'새로 설계'});
    if(!ok)return;
  }
  setBusy(key,'설계하는 중');render();
  try{
    let items;
    if(isDemo()){
      const all=await demoDesign(kind,4),used=new Set(keep.map(e=>e.name)),k=keep.length%all.length;
      items=[...all.slice(k),...all.slice(0,k)].filter(e=>!used.has(e.name)).slice(0,n);
    }else{
      const data=await genJSON({system:SYS_DESIGN,prompt:designPrompt(kind,n,keep),schema:kind==='char'?CHAR_SCHEMA:BG_SCHEMA});
      const raw=(kind==='char'?data.characters:data.backgrounds)||[];
      items=raw.slice(0,n).map(kind==='char'?normChar:normBg);
      if(!items.length)throw new ApiError(0,'설계 결과가 비어 있습니다. 다시 시도해 주세요.','empty');
    }
    S.project[K.list]=[...keep,...items];
    if(S.ui.drawer?.kind===kind)S.ui.drawer=null;
    pruneRefs();sweepImages();markDirty();
    toast(`${K.label} ${items.length}${K.unit}을 설계했습니다.`,'ok');
  }catch(e){fail(e)}finally{clearBusy(key);render()}
}
async function designAll(){
  if(needBrief())return;
  const p=S.project,drop=p.characters.filter(e=>!e.locked).length+p.backgrounds.filter(e=>!e.locked).length;
  if(drop){
    const ok=await confirmBox({title:'캐릭터와 배경을 새로 설계할까요?',msg:`잠그지 않은 캐릭터와 배경 ${drop}개가 새 설계로 바뀝니다. 남기고 싶은 항목은 자물쇠를 먼저 켜 주세요.`,ok:'새로 설계'});
    if(!ok)return;
  }
  S.step='chars';render();
  await design('char',true);
  await design('bg',true);
}

async function drawEnt(kind,id,signal){
  const K=KIND[kind],e=S.project[K.list].find(x=>x.id===id);if(!e||BUSY.has(id))return;
  setBusy(id,'그리는 중');render();
  try{
    let img;
    if(isDemo()){await sleep(500+Math.random()*500,signal);img=putSVG(kind==='char'?charSVG(e,'demo',uid()):bgSVG(e,'demo',uid()),'demo')}
    else{
      const refs=[];let prompt=entPrompt(kind,e);
      if(e.image&&imgKind(e.image)==='upload'){
        refs.push({label:kind==='char'?'reference photo or drawing of this character':'reference photo or drawing of this location',data:await refPart(e.image)});
        prompt+=kind==='char'?'\nBase the face, hair and outfit on Image 1, redrawn in the art style above.':'\nBase the place on Image 1, redrawn in the art style above, with all people removed.';
      }
      img=await genImage({prompt,refs,ratio:K.ratio,signal});
    }
    pushVariant(e,img);markDirty();
  }finally{clearBusy(id);render()}
}
async function drawCut(id,signal){
  const cut=cutById(id);if(!cut||BUSY.has(id))return;
  setBusy(id,'그리는 중');render();
  try{
    let img;
    if(isDemo()){await sleep(500+Math.random()*600,signal);img=putSVG(cutSVG(cut,'demo',uid()),'demo')}
    else{
      const plan=cutPlan(cut),refs=[];
      for(const r of plan.refs)refs.push({label:r.label,data:await refPart(r.img)});
      img=await genImage({prompt:cut.promptOverride.trim()||plan.prompt,refs,ratio:S.project.brief.ratio,signal});
    }
    pushVariant(cut,img);markDirty();
  }finally{clearBusy(id);render()}
}
async function runBatch(label,ids,worker){
  if(S.batch||!ids.length)return;
  const ctrl=new AbortController();let failed=0,fatal=null;
  S.batch={label,done:0,total:ids.length,ctrl};render();
  const q=[...ids],conc=isDemo()?3:clamp(S.settings.concurrency,1,4);
  const lane=async()=>{
    while(q.length&&!ctrl.signal.aborted){
      const id=q.shift();
      try{await worker(id,ctrl.signal)}
      catch(e){if(e.name!=='AbortError'){failed++;console.error(e);if(isFatal(e)){fatal=fatal||e;ctrl.abort()}else if(failed===1)toast(explain(e),'error')}}
      if(S.batch){S.batch.done++;render()}
    }
  };
  await Promise.all(Array.from({length:Math.min(conc,ids.length)},lane));
  const stopped=ctrl.signal.aborted;S.batch=null;render();
  if(fatal)toast(explain(fatal),'error');
  else if(stopped)toast('생성을 중단했습니다. 이미 그린 그림은 남아 있습니다.');
  else toast(failed?`${label}: ${ids.length-failed}개 완료, ${failed}개 실패. 실패한 항목은 다시 시도해 주세요.`:`${label} ${ids.length}개를 모두 마쳤습니다.`,failed?'error':'ok');
}

    if(isDemo()){await sleep(900);data=demoScenarioRaw()}

}
async function rewriteCut(i){
  const cuts=S.project.scenario.cuts,cut=cuts[i];if(!cut)return;
  const instr=(S.ui.rw[cut.id]||'').trim(),key='rw-'+cut.id;
  if(!instr){toast('이 컷을 어떻게 고칠지 한 줄로 적어 주세요.','error');return}
  if(BUSY.has(key))return;
  setBusy(key,'고치는 중');render();
  try{
    let next;
    if(isDemo()){await sleep(700);next={...cut,action:`${cut.action} (${instr})`,lines:cut.lines.map(l=>({...l}))};toast('데모 모드에서는 지시를 연출 문장 끝에 붙이기만 합니다.')}
    else{
      const raw=await genJSON({system:SYS_WRITER,prompt:rewritePrompt(cut,instr),schema:CUT_ITEM});
      next={...normCut(raw.cut||raw),id:cut.id,image:cut.image,variants:cut.variants};
    }
    const at=cuts.findIndex(c=>c.id===cut.id);
    if(at>=0){cuts[at]=next;S.ui.rw[cut.id]='';markDirty()}
  }catch(e){fail(e)}finally{clearBusy(key);render()}
}

/* ── 이벤트 ── */
function onFile(t){
  const files=[...t.files];t.value='';if(!files.length)return;
  const kind=t.dataset.file,images=files.filter(f=>f.type.startsWith('image/'));
  if(kind==='project'){loadProject(files[0]).catch(e=>toast('프로젝트 파일을 읽지 못했습니다. 컷인 스튜디오에서 저장한 .json 파일인지 확인해 주세요.','error'));return}
  if(!images.length){toast('이미지 파일을 골라 주세요.','error');return}
  if(kind==='product'){const list=S.project.brief.productImages;for(const f of images.slice(0,3-list.length))list.push(putBlob(f,'upload'))}
  if(kind==='ent'){const e=S.project[KIND[t.dataset.kind].list].find(x=>x.id===t.dataset.id);if(e)pushVariant(e,putBlob(images[0],'upload'))}
  if(kind==='cut'){const c=cutById(t.dataset.id);if(c)pushVariant(c,putBlob(images[0],'upload'))}
  markDirty();render();
}
function bindEvents(){
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
    const fn=ACT[t.dataset.act];if(fn)fn(t.dataset,t,e);
  });
  document.addEventListener('input',e=>{
    const t=e.target;if(!t.dataset||!t.dataset.bind||t.tagName==='SELECT')return;
    setPath(S,t.dataset.bind,t.value);
    if(t.dataset.bind.startsWith('project'))markDirty();
    if(t.dataset.bind==='settings.apiKey')S.ui.keyMsg=null;
    live();
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.type==='file'){onFile(t);return}
    if(t.dataset.manual){S.project.export.manual[t.dataset.manual]=t.checked;markDirty();return}
    if(t.dataset.model){if(t.value==='__custom')S.ui.custom[t.dataset.model]=true;else S.settings[t.dataset.model+'Model']=t.value;render();return}
    if(t.tagName==='SELECT'&&t.dataset.bind){
      setPath(S,t.dataset.bind,t.value);
      const m=/^project\.scenario\.cuts\.(\d+)\.lines\.(\d+)\.type$/.exec(t.dataset.bind);
      if(m){const ln=S.project.scenario.cuts[+m[1]].lines[+m[2]];if(ln.type==='narr'||ln.type==='sfx'){ln.who='';ln.tail='none';ln.w=ln.type==='sfx'?70:60}else{ln.w=46;if(ln.tail==='none')ln.tail='left'}}
      markDirty();render();return;
    }
  });
  document.addEventListener('compositionstart',()=>{composing=true});
  document.addEventListener('compositionend',()=>{composing=false;if(pendingRender){pendingRender=false;render()}});
  document.addEventListener('toggle',e=>{const k=e.target.dataset?.keep;if(k)S.ui.open[k]=e.target.open},true);
  document.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('label[tabindex]')){e.preventDefault();e.target.querySelector('input[type=file]')?.click();return}
    if(e.key!=='Escape')return;
    if(S.ui.modal){S.ui.modal.type==='confirm'?closeConfirm(false):ACT.closeModal()}
    else if(S.ui.drawer)ACT.closeDrawer();
  });
  /* 말풍선 끌기 */
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.strip .bub');if(!b||e.button!==0)return;
    const pr=b.closest('.panel').getBoundingClientRect(),br=b.getBoundingClientRect();
    drag={b,pr,ox:e.clientX-(br.left+br.width/2),oy:e.clientY-(br.top+br.height/2),sx:e.clientX,sy:e.clientY,moved:false};
  });
  document.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;
    drag.moved=true;e.preventDefault();
    drag.x=clamp((e.clientX-drag.ox-drag.pr.left)/drag.pr.width*100,3,97);
    drag.y=clamp((e.clientY-drag.oy-drag.pr.top)/drag.pr.height*100,3,97);
    drag.b.style.left=drag.x+'%';drag.b.style.top=drag.y+'%';
  });
  const end=()=>{
    if(drag?.moved){const ln=cutById(drag.b.dataset.cut)?.lines.find(l=>l.id===drag.b.dataset.line);if(ln){ln.x=Math.round(drag.x*10)/10;ln.y=Math.round(drag.y*10)/10;markDirty()}}
    drag=null;
  };
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
  window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
}

/* ═══ 50 · 원고 합성(canvas), 파일 저장·불러오기, 시작 ═══ */
const CFONT={
  bubble:'"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
  hand:'"Gaegu","Gowun Dodum","Apple SD Gothic Neo",sans-serif',
  display:'"Black Han Sans","Display Fallback","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
  body:'"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
  mono:'"IBM Plex Mono",ui-monospace,Menlo,monospace',
};
const INK='#15161C';
function wrapText(x,text,maxW){
  const out=[];let wrapped=false;const fits=s=>x.measureText(s).width<=maxW;
  for(const para of String(text).split('\n')){
    let line='';
    for(const word of para.split(' ')){
      const cand=line?line+' '+word:word;
      if(fits(cand)){line=cand;continue}
      if(line){out.push(line);wrapped=true;line=''}
      if(fits(word)){line=word;continue}
      let cur='';for(const ch of word){if(cur&&!fits(cur+ch)){out.push(cur);wrapped=true;cur=ch}else cur+=ch}
      line=cur;
    }
    out.push(line);
  }
  return {lines:out,wrapped};
}
async function fontsReady(text){
  if(!document.fonts?.load)return;
  const sample=(text||'')+'가나다 ABC 123';
  await Promise.all([`400 20px ${CFONT.bubble}`,`700 20px ${CFONT.hand}`,`400 20px ${CFONT.display}`,`500 20px ${CFONT.body}`,`600 20px ${CFONT.body}`,`600 20px ${CFONT.mono}`].map(f=>document.fonts.load(f,sample).catch(()=>{})));
}
function drawCover(x,im,X,Y,W,H){
  const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
  if(!iw||!ih)return;
  const s=Math.max(W/iw,H/ih),sw=W/s,sh=H/s;
  x.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,X,Y,W,H);
}
function drawContain(x,im,X,Y,W,H){
  const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;if(!iw||!ih)return;
  const s=Math.min(W/iw,H/ih),w=iw*s,h=ih*s;x.drawImage(im,X+(W-w)/2,Y+(H-h)/2,w,h);
}
/* 화면의 말풍선(.bub)과 같은 수치로 그립니다 */
function drawBubble(x,ln,PX,PY,W,PH){
  if(!String(ln.text).trim())return;
  const t=BUB[ln.type]?ln.type:'say',B=BUB[t],fs=W*B.fs/100,lh=fs*1.35,sw=Math.max(1.5,W*.0045);
  x.save();x.beginPath();x.rect(PX,PY,W,PH);x.clip();
  x.font=`${B.weight} ${fs}px ${CFONT[B.font]}`;x.textAlign='center';x.textBaseline='middle';
  const padX=B.px*fs,padY=B.py*fs,maxBox=W*ln.w/100;
  const {lines,wrapped}=wrapText(x,ln.text,Math.max(fs,maxBox-2*padX));
  const tw=Math.max(...lines.map(l=>x.measureText(l).width));
  const bw=wrapped?maxBox:tw+2*padX,bh=lines.length*lh+2*padY;
  const cx=PX+W*ln.x/100,cy=PY+PH*ln.y/100,L=cx-bw/2,T=cy-bh/2;
  x.lineJoin='round';x.lineWidth=sw;x.strokeStyle=INK;x.fillStyle='#fff';
  if(t==='sfx'){
    x.translate(cx,cy);x.rotate(-6*Math.PI/180);
    x.lineWidth=fs*.18;x.strokeStyle='#fff';x.fillStyle=INK;
    lines.forEach((l,i)=>{const y=(i-(lines.length-1)/2)*lh;x.strokeText(l,0,y);x.fillText(l,0,y)});
    x.restore();return;
  }
  const dir=ln.tail==='right'?'right':ln.tail==='left'?'left':'';
  const u=fs*.06; // 꼬리 viewBox 한 칸
  const tx=dir==='left'?L+bw*.34:L+bw-bw*.34-fs*1.2,ty=T+bh-fs*.30;
  const tp=d=>{const p=new Path2D();const m=d.match(/[MLZ][^MLZ]*/g)||[];for(const seg of m){const c=seg[0],nums=seg.slice(1).trim().split(/[\s,]+/).map(Number);if(c==='M')p.moveTo(tx+nums[0]*u,ty+nums[1]*u);else if(c==='L')p.lineTo(tx+nums[0]*u,ty+nums[1]*u);else p.closePath()}return p};
  if(dir&&t==='say'){const p=tp(TAIL[dir].line);x.fill(p);x.stroke(p)}
  if(dir&&t==='think'){
    const bx=dir==='left'?L+bw*.34:L+bw*.66,by=T+bh;
    for(const [dx,dy,r] of [[.38,.30,.28],[dir==='left'?.17:.63,.79,.17]]){x.beginPath();x.arc(bx+dx*fs,by+dy*fs,Math.max(1,r*fs-sw/2),0,Math.PI*2);x.fill();x.stroke()}
  }
  x.beginPath();
  if(t==='narr')x.rect(L,T,bw,bh);
  else if(t==='shout'){BURST.forEach(([a,b],i)=>{const X=L+bw*a/100,Y=T+bh*b/100;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath()}
  else x.ellipse(cx,cy,bw*.495,bh*.495,0,0,Math.PI*2);
  if(t==='think')x.setLineDash([W*.016,W*.011]);
  x.fill();x.stroke();x.setLineDash([]);
  if(dir&&t==='say'){x.fillStyle='#fff';x.fill(tp(TAIL[dir].patch))}
  x.fillStyle=INK;
  lines.forEach((l,i)=>x.fillText(l,cx,T+padY+lh*(i+.5)));
  x.restore();
}
function drawTitleCard(x,W,H,disc){
  const p=S.project,m=W*.055;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.textAlign='left';x.textBaseline='alphabetic';
  if(disc){
    x.font=`600 ${W*.029}px ${CFONT.body}`;const tw=x.measureText(disc).width,bw=tw+W*.036+W*.007,bh=W*.029+W*.022+W*.007;
    x.lineWidth=W*.0035;x.strokeStyle=INK;x.strokeRect(m+W*.00175,W*.05+W*.00175,bw-W*.0035,bh-W*.0035);
    x.fillStyle=INK;x.textBaseline='middle';x.fillText(disc,m+W*.018+W*.0035,W*.05+bh/2);x.textBaseline='alphabetic';
  }
  const title=p.scenario.title||p.name,log=p.scenario.logline||'';
  x.font=`500 ${W*.033}px ${CFONT.body}`;const ll=log?wrapText(x,log,W-2*m).lines:[];
  x.font=`400 ${W*.078}px ${CFONT.display}`;const tl=wrapText(x,title,W-2*m).lines;
  let y=H-W*.05-W*.0045;x.textBaseline='middle';
  x.fillStyle='#3C3F4C';x.font=`500 ${W*.033}px ${CFONT.body}`;
  for(let i=ll.length-1;i>=0;i--){const lh=W*.033*1.4;x.fillText(ll[i],m,y-lh/2);y-=lh}
  if(ll.length)y-=W*.016;
  x.fillStyle=INK;x.font=`400 ${W*.078}px ${CFONT.display}`;
  for(let i=tl.length-1;i>=0;i--){const lh=W*.078*1.14;x.fillText(tl[i],m,y-lh/2);y-=lh}
  x.fillRect(0,H-W*.0045,W,W*.0045);
}
async function drawEndCard(x,Y,W,H,disc){
  const b=S.project.brief,m=W*.055;
  x.fillStyle='#fff';x.fillRect(0,Y,W,H);x.fillStyle=INK;x.fillRect(0,Y,W,W*.0045);
  x.textAlign='left';x.textBaseline='middle';
  let y=Y+W*.06+W*.0045;
  const block=(text,font,fs,lhK,color)=>{x.font=font;x.fillStyle=color;for(const l of wrapText(x,text,W*.54).lines){const lh=fs*lhK;x.fillText(l,m,y+lh/2);y+=lh}};
  block('제작 지원',`600 ${W*.025}px ${CFONT.mono}`,W*.025,1,'#6B7080');y+=W*.02;
  block(b.brand||'브랜드',`400 ${W*.064}px ${CFONT.display}`,W*.064,1.15,INK);y+=W*.014;
  if(b.product){block(b.product,`600 ${W*.036}px ${CFONT.body}`,W*.036,1.3,INK);y+=W*.016}
  if(b.usp)block(b.usp,`400 ${W*.031}px ${CFONT.body}`,W*.031,1.45,'#3C3F4C');
  const pid=b.productImages[0];
  if(pid&&IMG.has(pid)){try{drawContain(x,await loadImage(imgURL(pid)),W-m-W*.3,Y+W*.06+W*.0045,W*.3,H-W*.12-W*.0045)}catch(_){}}
  if(disc){x.fillStyle='#6B7080';x.font=`500 ${W*.025}px ${CFONT.body}`;x.fillText(disc,m,Y+H-W*.045-W*.0125)}
}
async function buildStrip(width){
  const p=S.project,ex=p.export,cuts=p.scenario.cuts,n=cuts.length,disc=disclosureText();
  const [rw,rh]=p.brief.ratio.split(':').map(Number);
  const measure=W=>{const ph=Math.round(W*rh/rw),gap=Math.round(ex.gap*W/720),th=ex.title?Math.round(W*5/12):(disc?Math.round(W*.075):0),eh=ex.end?Math.round(W/2):0;
    return {W,ph,gap,th,eh,H:th+(ex.title&&n?gap:0)+n*ph+Math.max(0,n-1)*gap+(ex.end&&n?gap:0)+eh}};
  let m=measure(width);
  if(m.H>30000)m=measure(Math.floor(width*30000/m.H));
  const {W,ph,gap,th,eh,H}=m;
  await fontsReady([p.scenario.title,p.scenario.logline,p.brief.brand,p.brief.product,p.brief.usp,disc,...cuts.flatMap(c=>c.lines.map(l=>l.text))].join(' '));
  const c=document.createElement('canvas');c.width=W;c.height=Math.max(1,H);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  let y=0;
  if(ex.title){drawTitleCard(x,W,th,disc);y=th+(n?gap:0)}
  else if(disc){x.fillStyle=INK;x.font=`600 ${W*.027}px ${CFONT.body}`;x.textAlign='left';x.textBaseline='middle';x.fillText(disc,W*.055,th/2);x.fillRect(0,th-W*.003,W,W*.003);y=th}
  for(let i=0;i<n;i++){
    const cut=cuts[i];
    try{drawCover(x,await loadImage(cut.image&&IMG.has(cut.image)?imgURL(cut.image):svgDataURL(cutSVG(cut))),0,y,W,ph)}catch(_){}
    for(const ln of cut.lines)drawBubble(x,ln,0,y,W,ph);
    y+=ph+(i<n-1?gap:0);
  }
  if(ex.end)await drawEndCard(x,y+(n?gap:0),W,eh,disc);
  return c;
}
let prevToken=0;
async function refreshExportPreview(){
  const box=$('#exPrev');if(!box||!S.project.scenario.cuts.length)return;
  const token=++prevToken;
  try{
    const c=await buildStrip(720);
    if(token!==prevToken||!document.body.contains(box))return;
    const top=box.scrollTop;box.replaceChildren(c);box.scrollTop=top;
    const full=S.project.export.width,info=$('#exInfo');
    if(info)info.textContent=`저장 크기 약 ${full} × ${Math.round(c.height*full/720)}px (미리보기는 720px 폭으로 그렸습니다)`;
  }catch(e){if(token===prevToken)box.innerHTML='<p>미리보기를 그리지 못했습니다.</p>';console.error(e)}
}
const safeName=s=>(String(s).trim().replace(/[\\/:*?"<>|]+/g,'_').slice(0,60)||'cutin');
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
}
async function exportPNG(){
  toast('원고를 합치는 중입니다…');
  const c=await buildStrip(S.project.export.width);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  if(!blob)throw new ApiError(0,'원고가 너무 커서 이미지로 만들지 못했습니다. 가로 폭을 720px로 줄여 주세요.','empty');
  download(blob,safeName(S.project.scenario.title||S.project.name)+'.png');
  toast(`${c.width} × ${c.height}px PNG로 저장했습니다.`,'ok');
}
function scriptText(){
  const p=S.project,b=p.brief,sc=p.scenario,T={say:'',think:'(생각) ',shout:'(외침) '};
  const out=[`제목: ${sc.title}`,`로그라인: ${sc.logline}`,`시놉시스: ${sc.synopsis}`,`브랜드·제품: ${b.brand} ${b.product}`,`광고 표기: ${disclosureText()||'없음'}`,''];
  sc.cuts.forEach((c,i)=>{
    out.push(`[C${pad2(i+1)}] 배경: ${bgById(c.bg)?.name||'-'} | 샷: ${shotOf(c.shot).ko} | 등장: ${c.chars.map(id=>charById(id)?.name).filter(Boolean).join(', ')||'-'}`);
    out.push(`연출: ${c.action}`);
    for(const l of c.lines){
      if(l.type==='narr')out.push(`[내레이션] ${l.text}`);
      else if(l.type==='sfx')out.push(`[효과음] ${l.text}`);
      else out.push(`${T[l.type]}${charById(l.who)?.name||'?'}: ${l.text}`);
    }
    out.push(`PPL: ${PPL[c.ppl].ko}${c.pplNote?' — '+c.pplNote:''}`,'');
  });
  return out.join('\n');
}
function exportScript(){download(new Blob([scriptText()],{type:'text/plain;charset=utf-8'}),safeName(S.project.scenario.title||S.project.name)+'_시나리오.txt');toast('시나리오를 텍스트 파일로 저장했습니다.','ok')}
async function saveProject(){
  /* 파일 크기를 줄이려고 지금 선택된 그림만 담습니다 */
  const p=structuredClone(S.project),images={};
  for(const e of [...p.characters,...p.backgrounds,...p.scenario.cuts])e.variants=e.image&&IMG.has(e.image)?[e.image]:[];
  for(const id of usedImages(p)){const it=IMG.get(id);if(it)images[id]={kind:it.kind,data:await blobToDataURL(it.blob)}}
  download(new Blob([JSON.stringify({app:'cutin-studio',v:1,project:p,images})],{type:'application/json'}),safeName(p.name)+'.cutin.json');
  S.dirty=false;toast('프로젝트 파일을 저장했습니다.','ok');
}
async function loadProject(file){
  const data=JSON.parse(await file.text());
  if(data?.app!=='cutin-studio'||!data.project)throw new Error('format');
  for(const [id,im] of Object.entries(data.images||{})){
    const res=await fetch(im.data);putBlob(await res.blob(),im.kind||'gen',id);
  }
  const base=blankProject(),p=data.project;
  S.project={...base,...p,brief:{...base.brief,...p.brief},scenario:{...base.scenario,...p.scenario},export:{...base.export,...p.export}};
  const has=id=>id&&IMG.has(id);
  S.project.brief.productImages=S.project.brief.productImages.filter(has);
  for(const e of [...S.project.characters,...S.project.backgrounds,...S.project.scenario.cuts]){e.variants=(e.variants||[]).filter(has);if(!has(e.image))e.image=e.variants[0]||null}
  pruneRefs();S.step='brief';S.ui.drawer=null;S.ui.selCut=null;S.dirty=false;render();
  toast(`‘${S.project.name}’ 프로젝트를 불러왔습니다.`,'ok');
}

    must:'캔 로고가 정면으로 보이는 컷, 마시는 장면 한 번',avoid:'음주를 연상시키는 장면, 과장된 효능 표현',
    prompt:'야근에 지친 신입 디자이너가 무뚝뚝한 선배와 편의점 앞에서 우연히 마주치며 가까워지는 오피스 로맨스. 마지막은 설레는 여운으로 끝난다.',
    genres:['로맨스','오피스'],tones:['설렘','유쾌'],pplLevel:3,pplModes:['use','talk'],cuts:8});
  S.project=p;
  p.characters=demoChars().slice(0,2).map(normChar);
  p.backgrounds=demoBgs().slice(0,2).map(normBg);
  const raw=demoScenarioRaw();
  p.scenario={title:raw.title,logline:raw.logline,synopsis:raw.synopsis,cuts:raw.cuts.map(normCut)};
  S.ui.selCut=p.scenario.cuts[0].id;
  return p;
}
function boot(){
  sampleProject();
  bindEvents();
  render();
  document.fonts?.ready?.then(()=>{if(S.step==='export')refreshExportPreview()});
}
boot();
